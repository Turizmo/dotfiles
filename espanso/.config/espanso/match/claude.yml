# Claude Code shortcuts
matches:
  # Compact the Claude Code context down to what the planned work needs
  - trigger: ";rc"
    replace: "/compact Keep only what is needed to continue the planned work: the task and when it is done, what is done and not done, file:line pointers for every place the work touches, decisions with their reasons, rejected approaches with why, how to verify, and open questions. Drop everything else, including anything in CLAUDE.md or memory."
    # Terminals don't paste with Ctrl+V, so type the text instead
    force_mode: keys
